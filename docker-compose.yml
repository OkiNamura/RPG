services:
  omika:
    build: .
    container_name: omika
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7801
    # Снаружи порт не открываем: рядом reverse proxy с HTTPS.
    # Вход в игру — по OMIKA_PASSWORD.
    ports:
      - "127.0.0.1:7801:7801"
    volumes:
      - omika-data:/app/data

volumes:
  omika-data:
