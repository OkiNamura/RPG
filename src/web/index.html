<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Omika" />
    <title>OMIKA — хроники</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css?v=20261105-1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🜂</text></svg>" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo"><span class="sigil">🜂</span><span>OMIKA</span></div>

      <nav class="nav" id="nav">
        <a href="#/profile" data-route="profile"><i>◈</i>Профиль</a>
        <a href="#/new" data-route="new"><i>＋</i>Новая игра</a>
        <a href="#/stories" data-route="stories"><i>▤</i>Истории</a>
        <a href="#/search" data-route="search"><i>⌕</i>Поиск</a>
        <a href="#/templates" data-route="templates"><i>▣</i>Карточки</a>
        <a href="#/admin" data-route="admin"><i>⚙</i>Админка</a>
      </nav>

      <div class="side-map hidden" id="side-map"></div>

      <div class="side-foot">
        <div class="side-user">
          <div class="avatar-mini">О</div>
          <div class="side-user-text">
            <b>ОкиНамура</b>
            <span id="side-level">уровень 0</span>
          </div>
        </div>
        <div class="side-hint">локальный стенд · v0.1</div>
      </div>
    </aside>

    <main class="main">
      <div id="view" class="view"></div>
    </main>

    <datalist id="model-list">
      <option value="deepseek/deepseek-v4-flash-0731"></option>
      <option value="deepseek/deepseek-v4-flash"></option>
      <option value="deepseek/deepseek-v4.1-flash-1017"></option>
      <option value="deepseek/deepseek-v3.2"></option>
      <option value="deepseek/deepseek-v4-pro"></option>
    </datalist>

    <div id="toast" class="toast hidden"></div>

    <div id="overlay" class="overlay hidden">
      <div class="dialog">
        <h2>Новая хроника</h2>
        <p class="dialog-sub">
          Имя кампании. Мир и тон пока берутся из базовой заготовки — генератор по тегам будет следующим шагом.
        </p>
        <input id="campaign-name" type="text" placeholder="например: пепельный тракт" maxlength="40" />
        <div class="dialog-actions">
          <button id="cancel-new" class="ghost">Отмена</button>
          <button id="create-new" class="primary">Начать</button>
        </div>
        <div id="dialog-error" class="dialog-error"></div>
      </div>
    </div>

    <script type="module" src="/app.js?v=20261105-1"></script>
  </body>
</html>
